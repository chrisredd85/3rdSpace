name: Venue website extraction

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain-venue-contact-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke venue website extraction worker
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.3rdplace.io/api/internal/jobs/venue-website-extraction")

          cat response.json

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Venue website extraction returned HTTP $status"
            exit 1
          fi
