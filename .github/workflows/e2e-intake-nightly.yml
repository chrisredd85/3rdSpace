name: Intake Phrase E2E

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  e2e-intake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full intake phrase E2E
        run: npm run test:e2e -- e2e/intake-chat-flow.spec.ts --project=chromium
        env:
          PILOT_PHRASE_E2E_FULL: '1'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intake-playwright-report
          path: playwright-report/
          retention-days: 30
