      - 'lib/**'
      - 'components/**'
      - 'supabase/migrations/**'
      - 'supabase/seeds/**'
      - 'scripts/security/**'
      - 'scripts/release/toggle-write-pause.sh'
      - '__tests__/security/**'
      - '__tests__/schema/write-pause-migration.test.ts'
      - '__tests__/write-pause-*.test.ts'
      - '__tests__/server/admin-auth.test.ts'
      - '__tests__/stripe-webhook-replay-auth.test.ts'
      - '__tests__/integration/builder-events-materialization-route.test.ts'
      - '__tests__/integration/canonical-plan-event-identity-realized.test.ts'
      - '__tests__/integration/stripe-connect-webhook.test.ts'
      - '__tests__/integration/stripe-kickback-invoice-webhook.test.ts'
      - '__tests__/integration/stripe-webhook-*.test.ts'
      - '__tests__/integration/venue-rental-refund-routes.test.ts'
      - '__tests__/integration/write-pause-*.test.ts'
      - '__tests__/integration/canonical-booking-partner-*-routes.test.ts'
      - '__tests__/integration/canonical-booking-partner-decline-realized.test.ts'
      - '__tests__/integration/canonical-vendor-claim-binding-realized.test.ts'
      - '__tests__/integration/approval-version-retry-realized.test.ts'
      - '__tests__/integration/terminal-plan-positive-execution-realized.test.ts'
      - '__tests__/integration/canonical-quote-reapproval-realized.test.ts'
      - '__tests__/integration/prompt8-execution-modes-realized.test.ts'
      - '__tests__/schema/canonical-booking-decline-migration.test.ts'
      - '__tests__/schema/canonical-booking-provenance-hardening-migration.test.ts'
      - '__tests__/schema/canonical-vendor-claim-binding-migration.test.ts'
      - '__tests__/schema/canonical-venue-confirmation-effects-migration.test.ts'
      - '__tests__/schema/approval-version-retry-migration.test.ts'
      - '__tests__/schema/terminal-plan-positive-execution-migration.test.ts'
      - '__tests__/schema/canonical-booking-batch-confirmation-migration.test.ts'
      - '__tests__/schema/canonical-quote-resume-claim-migration.test.ts'
      - '__tests__/schema/canonical-plan-event-identity-migration.test.ts'
      - '__tests__/schema/prompt8-*-migration.test.ts'
      - '__tests__/security/stored-functions-realized.test.ts'
      - '__tests__/integration/vendor-base-rate-repair-db.test.ts'
      - 'app/api/builder/events/**'
      - 'app/api/internal/write-pause/**'
      - 'app/api/internal/stripe-webhooks/replay-deferred/**'
      - 'app/api/webhooks/stripe/**'
      - 'lib/hooks/useEvents.ts'
      - 'lib/server/admin-auth.ts'
      - 'lib/write-pause.ts'
      - 'lib/stripe/webhookLedger.ts'
      - 'lib/stripe/webhookReplayAuth.ts'
      - 'middleware.ts'
      - 'app/api/planner/plans/**/approvals/**'
      - 'app/api/planner/plans/**/materialize/**'
      - 'app/api/vendor/bookings/**'
      - 'app/api/venue/bookings/**'
      - 'app/api/venue/bulk-approval/**'
      - 'lib/planner/execution/canonicalBooking*.ts'
      - 'lib/planner/execution/__tests__/canonicalBooking*.test.ts'
      - 'lib/outreach/gmailApprovalFlow.ts'
      - 'lib/planner/execution/canonicalQuoteBooking.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rls-checks.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'supabase/migrations/**'
      - 'supabase/seeds/**'
      - 'scripts/security/**'
      - 'scripts/release/toggle-write-pause.sh'
      - '__tests__/security/**'
      - '__tests__/schema/write-pause-migration.test.ts'
      - '__tests__/write-pause-*.test.ts'
      - '__tests__/server/admin-auth.test.ts'
      - '__tests__/stripe-webhook-replay-auth.test.ts'
      - '__tests__/integration/builder-events-materialization-route.test.ts'
      - '__tests__/integration/canonical-plan-event-identity-realized.test.ts'
      - '__tests__/integration/stripe-connect-webhook.test.ts'
      - '__tests__/integration/stripe-kickback-invoice-webhook.test.ts'
      - '__tests__/integration/stripe-webhook-*.test.ts'
      - '__tests__/integration/venue-rental-refund-routes.test.ts'
      - '__tests__/integration/write-pause-*.test.ts'
      - '__tests__/integration/canonical-booking-partner-*-routes.test.ts'
      - '__tests__/integration/canonical-booking-partner-decline-realized.test.ts'
      - '__tests__/integration/canonical-vendor-claim-binding-realized.test.ts'
      - '__tests__/integration/approval-version-retry-realized.test.ts'
      - '__tests__/integration/terminal-plan-positive-execution-realized.test.ts'
      - '__tests__/integration/canonical-quote-reapproval-realized.test.ts'
      - '__tests__/integration/prompt8-execution-modes-realized.test.ts'
      - '__tests__/schema/canonical-booking-decline-migration.test.ts'
      - '__tests__/schema/canonical-booking-provenance-hardening-migration.test.ts'
      - '__tests__/schema/canonical-vendor-claim-binding-migration.test.ts'
      - '__tests__/schema/canonical-venue-confirmation-effects-migration.test.ts'
      - '__tests__/schema/approval-version-retry-migration.test.ts'
      - '__tests__/schema/terminal-plan-positive-execution-migration.test.ts'
      - '__tests__/schema/canonical-booking-batch-confirmation-migration.test.ts'
      - '__tests__/schema/canonical-quote-resume-claim-migration.test.ts'
      - '__tests__/schema/canonical-plan-event-identity-migration.test.ts'
      - '__tests__/schema/prompt8-*-migration.test.ts'
      - '__tests__/security/stored-functions-realized.test.ts'
      - '__tests__/integration/vendor-base-rate-repair-db.test.ts'
      - 'app/api/builder/events/**'
      - 'app/api/internal/write-pause/**'
      - 'app/api/internal/stripe-webhooks/replay-deferred/**'
      - 'app/api/webhooks/stripe/**'
      - 'lib/hooks/useEvents.ts'
      - 'lib/server/admin-auth.ts'
      - 'lib/write-pause.ts'
      - 'lib/stripe/webhookLedger.ts'
      - 'lib/stripe/webhookReplayAuth.ts'
      - 'middleware.ts'
      - 'app/api/planner/plans/**/approvals/**'
      - 'app/api/planner/plans/**/materialize/**'
      - 'app/api/vendor/bookings/**'
      - 'app/api/venue/bookings/**'
      - 'app/api/venue/bulk-approval/**'
      - 'lib/planner/execution/canonicalBooking*.ts'
      - 'lib/planner/execution/__tests__/canonicalBooking*.test.ts'
      - 'lib/outreach/gmailApprovalFlow.ts'
      - 'lib/planner/execution/canonicalQuoteBooking.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rls-checks.yml'
      - '.github/workflows/test.yml'
  merge_group:
    types: [checks_requested]

jobs:
  rls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client and ripgrep
        run: sudo apt-get update && sudo apt-get install -y postgresql-client ripgrep

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset local database
        run: supabase db reset

      - name: Lint realized database functions
        run: supabase db lint --fail-on error

      - name: Run realized stored-function regression tests
        run: npm test -- __tests__/security/stored-functions-realized.test.ts --runInBand
        env:
          RUN_DB_FUNCTION_TESTS: '1'

      - name: Run scoped tied-house compliance check
        run: npm run security:tied-house

      - name: Reject new unreviewed tied-house nomenclature
        run: node scripts/security/run-tied-house-release-delta.mjs

      - name: Run canonical plan-event identity regression tests
        run: npm test -- __tests__/schema/canonical-plan-event-identity-migration.test.ts __tests__/schema/canonical-booking-provenance-hardening-migration.test.ts __tests__/integration/canonical-plan-event-identity-realized.test.ts --runInBand
        env:
          RUN_CANONICAL_EVENT_DB_TESTS: '1'

      - name: Run realized three-mode execution lifecycle tests
        run: npm test -- __tests__/schema/prompt8-external-confirm-migration.test.ts __tests__/schema/prompt8-confirmation-side-effects-migration.test.ts __tests__/schema/canonical-booking-batch-confirmation-migration.test.ts __tests__/schema/canonical-venue-confirmation-effects-migration.test.ts __tests__/schema/canonical-quote-resume-claim-migration.test.ts __tests__/integration/prompt8-execution-modes-realized.test.ts --runInBand
        env:
          RUN_PROMPT8_DB_TESTS: '1'

      - name: Run canonical vendor claim-binding regression tests
        run: npm test -- __tests__/schema/canonical-vendor-claim-binding-migration.test.ts __tests__/integration/canonical-vendor-claim-binding-realized.test.ts --runInBand
        env:
          RUN_CANONICAL_VENDOR_CLAIM_DB_TESTS: '1'

      - name: Run approval retry and finalization concurrency tests
        run: npm test -- __tests__/schema/approval-version-retry-migration.test.ts __tests__/integration/approval-version-retry-realized.test.ts --runInBand
        env:
          RUN_APPROVAL_VERSION_DB_TESTS: '1'

      - name: Run terminal-plan execution boundary tests
        run: npm test -- __tests__/schema/terminal-plan-positive-execution-migration.test.ts __tests__/integration/terminal-plan-positive-execution-realized.test.ts --runInBand
        env:
          RUN_TERMINAL_PLAN_EXECUTION_DB_TESTS: '1'

      - name: Run canonical partner decline regression tests
        run: npm test -- __tests__/schema/canonical-booking-decline-migration.test.ts __tests__/integration/canonical-booking-partner-decline-routes.test.ts __tests__/integration/canonical-booking-partner-decline-realized.test.ts lib/planner/execution/__tests__/canonicalBookingConfirmation.test.ts lib/planner/execution/__tests__/canonicalBookingDecline.test.ts --runInBand
        env:
          RUN_CANONICAL_DECLINE_DB_TESTS: '1'

      - name: Run canonical quote re-approval recovery tests
        run: npm test -- __tests__/schema/canonical-quote-reapproval-migration.test.ts __tests__/schema/canonical-quote-reapproval-command-migration.test.ts __tests__/integration/canonical-quote-reapproval-realized.test.ts --runInBand
        env:
          RUN_CANONICAL_REAPPROVAL_DB_TESTS: '1'

      - name: Run builder event materialization route tests
        run: npm test -- __tests__/integration/builder-events-materialization-route.test.ts --runInBand

      - name: Run atomic vendor base-rate repair tests
        run: npm test -- __tests__/integration/vendor-base-rate-repair-db.test.ts --runInBand
        env:
          RUN_VENDOR_RATE_DB_TESTS: '1'

      - name: Run realized database security regression tests
        run: npm test -- __tests__/security/rls.test.ts __tests__/security/database-privileges.test.ts __tests__/security/execution-control-plane.test.ts --runInBand
        env:
          RUN_RLS_DB_TESTS: '1'

      - name: Run durable write-pause concurrency and ACL tests
        run: npm test -- __tests__/security/write-pause-realized.test.ts --runInBand
        env:
          RUN_WRITE_PAUSE_DB_TESTS: '1'

      - name: Run RLS enabled check
        run: npm run security:rls
