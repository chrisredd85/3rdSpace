name: Hosted Migration Parity

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact deployed commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-migration-parity-production
  cancel-in-progress: false

jobs:
  parity:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || inputs.deployed_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.95.4

      - name: Require production Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Compare deployed migrations with hosted ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run release:migrations:parity -- --linked
